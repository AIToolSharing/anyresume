name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The plugin build downloads the binary of the manifest version, so the
      # tag, the manifest version, and the download URLs must agree.
      - name: Check the plugin manifest version
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"$v\"$" herdr-plugin.toml
          test "$(grep -c "releases/download/v$v/" herdr-plugin.toml)" -eq 1
          grep -q "fetch-binary.sh\", \"$v\"" herdr-plugin.toml
      - name: Show the Go version
        run: go version
      - name: Test
        run: go test -count=1 ./...
      - name: Check for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Run the build commands of herdr-plugin.toml as "herdr plugin install"
  # runs them, and check that the downloaded binary starts.
  plugin-build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Run the Windows build command
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $line = (Select-String -Path herdr-plugin.toml -Pattern '^command = \["powershell"').Line
          $argv = ($line -replace '^command = ', '') | ConvertFrom-Json
          & $argv[0] $argv[1..($argv.Count - 1)]
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $got = & .\bin\anyresume.exe version
          if ($got -ne "$env:GITHUB_REF_NAME".TrimStart('v')) { throw "version is '$got'" }
      - name: Run the Linux and macOS build command
        if: runner.os != 'Windows'
        run: |
          sh scripts/fetch-binary.sh "${GITHUB_REF_NAME#v}"
          test "$(bin/anyresume version)" = "${GITHUB_REF_NAME#v}"
