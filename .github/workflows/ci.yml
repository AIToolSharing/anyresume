name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The toolchain line of go.mod selects the Go release with the
      # current security fixes of the standard library.
      - name: Show the Go version
        run: go version
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 ./...
      - name: Test with the race detector
        if: runner.os == 'Linux'
        run: go test -count=1 -race ./...
      - name: Check the format
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"
      - name: Staticcheck
        if: runner.os == 'Linux'
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: Check the plugin script
        if: runner.os == 'Linux'
        run: sh -n scripts/fetch-binary.sh
      - name: Check for known vulnerabilities
        if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
