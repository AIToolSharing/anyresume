id = "aitoolsharing.anyresume"
name = "anyresume"
version = "0.1.2"
min_herdr_version = "0.9.0"
description = "Resume any Claude Code session from one list, in its own folder (unofficial)"
platforms = ["linux", "macos", "windows"]

# The build commands download the release binary of this version into bin/.
# For a release, change the version in three places: the "version" line, the
# Windows download URL, and the argument of fetch-binary.sh.
# On Windows, PowerShell extracts the zip file. A "tar.exe" on PATH can be
# the GNU tar of Git for Windows, which cannot read zip files.
[[build]]
command = ["powershell", "-NoProfile", "-NonInteractive", "-Command", "$ErrorActionPreference = 'Stop'; $ProgressPreference = 'SilentlyContinue'; New-Item -ItemType Directory -Force bin | Out-Null; Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/AIToolSharing/anyresume/releases/download/v0.1.2/anyresume_windows_amd64.zip' -OutFile bin/anyresume.zip; Expand-Archive -Force bin/anyresume.zip bin"]
platforms = ["windows"]

[[build]]
command = ["sh", "scripts/fetch-binary.sh", "0.1.2"]
platforms = ["linux", "macos"]

# After herdr restores a session, type the resume command again in the tabs
# that "import" made. herdr restores those tabs with empty prompts.
[[startup]]
command = ["bin/anyresume", "import", "--refresh"]

[[actions]]
id = "pick"
title = "Resume a Claude Code session"
contexts = ["workspace"]
command = ["bin/anyresume", "popup"]

[[actions]]
id = "import"
title = "Make a tab for every Claude Code session"
contexts = ["workspace"]
command = ["bin/anyresume", "import"]

[[panes]]
id = "picker"
title = "Claude Code sessions"
placement = "popup"
width = "90%"
height = "80%"
command = ["bin/anyresume", "pick"]
